name: npm auth check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: Check npm authentication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Inspect the repository token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          echo "token_present=$([ -n "${NODE_AUTH_TOKEN}" ] && echo yes || echo no)"
          echo "token_length=${#NODE_AUTH_TOKEN}"
          echo "token_prefix=${NODE_AUTH_TOKEN:0:4}"
          echo "--- npm whoami ---"
          npm whoami --registry https://registry.npmjs.org
          echo "whoami_exit=$?"
          echo "--- npm profile ---"
          npm profile get --registry https://registry.npmjs.org 2>&1 | head -20
          echo "profile_exit=$?"
          echo "--- npm access list packages ---"
          npm access list packages reeinharddd --registry https://registry.npmjs.org 2>&1 | head -20
          echo "access_exit=$?"
          echo "--- npm view maintainers ---"
          npm view snapmcp maintainers --registry https://registry.npmjs.org 2>&1 | head -10
          echo "view_exit=$?"
