name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install chromium

      - name: Build + type check
        run: bun run build

      - name: Unit tests
        run: bun test tests/highlighter.test.ts tests/cli.test.ts tests/config.test.ts tests/security.test.ts tests/gif.test.ts tests/document.test.ts tests/capture-file-range.test.ts tests/renderer.test.ts

      - name: Integration tests (Linux only)
        if: runner.os == 'Linux'
        run: bun test tests/integration/*.test.ts
