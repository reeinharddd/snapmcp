name: Release

on:
  push:
    tags: ["v*"]
  # Manual trigger so a release can be re-published after a transient npm or
  # registry failure without moving the tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to package.json)"
        required: false
        type: string

permissions:
  contents: write
  packages: write
  # Required for npm Trusted Publishing (OIDC) and for the MCP Registry
  # GitHub OIDC exchange.
  id-token: write

env:
  # Pinned so the release always runs against a known npm CLI. Trusted
  # Publishing needs npm 11.5.1 or later.
  NPM_VERSION: 12.2.2
  # Pinned release of the official MCP Registry publisher CLI.
  MCP_PUBLISHER_VERSION: 1.8.9
  MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the version and tag to publish
        id: version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          REQUESTED="${{ inputs.version }}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$PKG_VERSION" ]; then
            echo "Requested version '$REQUESTED' does not match package.json version '$PKG_VERSION'" >&2
            exit 1
          fi
          TAG="v${PKG_VERSION}"
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag '${TAG}' does not exist. Push the tag before publishing so the npm tarball matches a released commit." >&2
            exit 1
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  npm-publish:
    name: Publish to npm
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install the pinned npm CLI
        run: npm install --global "npm@${{ env.NPM_VERSION }}" && npm --version

      - name: Configure npm authentication
        # The token is only a fallback for repositories that have not migrated
        # to Trusted Publishing yet. When the package has a trusted publisher
        # configured, npm exchanges the GitHub OIDC token instead and this
        # secret is never used: the exchanged token is written to the
        # non-persistable `cli` config layer, which takes precedence over both
        # the `.npmrc` entry and NODE_AUTH_TOKEN.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
            echo "npm_auth=token-fallback"
            # A revoked or malformed token makes npm answer 404 on PUT, which
            # reads like a permissions problem rather than an auth problem.
            # Report the token state explicitly so the log says which one failed.
            if npm whoami --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "npm_token_status=valid"
            else
              echo "npm_token_status=invalid — the publish will use the OIDC trusted publisher"
              echo "::warning::NPM_TOKEN is present but not accepted by the npm registry. Configure a trusted publisher for this workflow, or refresh the secret."
            fi
          else
            echo "npm_auth=oidc-only"
          fi

      - name: Publish to npm (skip if version already published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PKG_VERSION="${{ needs.resolve.outputs.version }}"
          if npm view "snapmcp@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "snapmcp@${PKG_VERSION} already on npm — skipping publish"
            exit 0
          fi
          if ! npm publish --access public --provenance; then
            echo "::error::npm publish failed. A 404 Not Found from the registry means the OIDC exchange produced no token. Check that a trusted publisher is configured on npmjs.com for this package with owner 'reeinharddd', repository 'snapmcp' and workflow 'release.yml', and that this workflow grants id-token: write."
            exit 1
          fi

  github-release:
    name: Create GitHub Release
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Create release
        # The action can fail at the very end while refreshing release asset
        # metadata, after every asset has already been uploaded. The assets
        # are the part that matters, so the failure is tolerated and the
        # verification step below decides whether the release is usable.
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          # Pinned explicitly so a manual dispatch targets the version tag
          # instead of the branch that triggered the workflow.
          tag_name: ${{ needs.resolve.outputs.tag }}
          # Without an explicit name the action falls back to the bare tag,
          # which titles the release "v2.3.10" instead of "snapmcp v2.3.10".
          name: snapmcp ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/**
            package.json

      - name: Verify the release is published with its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release for $TAG was not created" >&2
            exit 1
          fi
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$IS_DRAFT" = "true" ]; then
            echo "The release for $TAG is still a draft; publishing it"
            gh release edit "$TAG" --draft=false
          fi
          ASSET_COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [ "$ASSET_COUNT" -lt 10 ]; then
            echo "The release for $TAG only has $ASSET_COUNT assets" >&2
            exit 1
          fi
          echo "Release $TAG is published with $ASSET_COUNT assets"

  registry-publish:
    name: Publish to the MCP Registry
    needs: [resolve, npm-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the MCP Registry publisher
        run: |
          set -euo pipefail
          curl -sSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${{ env.MCP_PUBLISHER_VERSION }}/mcp-publisher_linux_amd64.tar.gz"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/mcp-publisher.tar.gz" | cut -d' ' -f1)"
          echo "expected=${{ env.MCP_PUBLISHER_SHA256 }}"
          echo "actual=${ACTUAL}"
          if [ "$ACTUAL" != "${{ env.MCP_PUBLISHER_SHA256 }}" ]; then
            echo "mcp-publisher checksum mismatch" >&2
            exit 1
          fi
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/mcp-publisher" /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Log in to the MCP Registry with GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Wait for the npm release to become visible
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # The MCP Registry validates that the referenced npm version exists
          # before it accepts the server. npm answers the publish immediately
          # but its CDN can take a few minutes to serve the new version, so a
          # registry publish right after the npm publish races the CDN and is
          # rejected with "version not found". Wait for the version instead.
          for attempt in $(seq 1 30); do
            if npm view "snapmcp@${EXPECTED_VERSION}" version 2>/dev/null | grep -qx "${EXPECTED_VERSION}"; then
              echo "snapmcp@${EXPECTED_VERSION} is visible on npm"
              exit 0
            fi
            echo "Attempt ${attempt}: snapmcp@${EXPECTED_VERSION} is not on npm yet, retrying in 20s"
            sleep 20
          done
          echo "::error::snapmcp@${EXPECTED_VERSION} did not appear on npm within 10 minutes" >&2
          exit 1

      - name: Publish server.json
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SERVER_JSON_VERSION="$(node -p "require('./server.json').version")"
          if [ "$PKG_VERSION" != "$SERVER_JSON_VERSION" ]; then
            echo "server.json version '$SERVER_JSON_VERSION' does not match package.json version '$PKG_VERSION'" >&2
            exit 1
          fi
          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "package.json version '$PKG_VERSION' does not match the resolved release version '$EXPECTED_VERSION'" >&2
            exit 1
          fi
          mcp-publisher validate ./server.json
          # The registry can still be serving a stale view of npm, so a
          # transient rejection is retried before the job fails.
          for attempt in 1 2 3; do
            if mcp-publisher publish ./server.json; then
              exit 0
            fi
            echo "Attempt ${attempt} to publish to the MCP Registry failed, retrying in 30s"
            sleep 30
          done
          echo "::error::could not publish ${PKG_VERSION} to the MCP Registry" >&2
          exit 1
