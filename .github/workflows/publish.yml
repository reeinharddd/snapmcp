name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # needed for provenance
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install chromium

      - name: Build + type check
        run: bun run build

      - name: Unit tests
        run: bun test tests/highlighter.test.ts tests/cli.test.ts tests/config.test.ts tests/security.test.ts tests/gif.test.ts tests/document.test.ts tests/capture-file-range.test.ts tests/renderer.test.ts

      - name: Integration tests
        run: bun test tests/integration/*.test.ts

      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
