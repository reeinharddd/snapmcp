<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa" />
      <stop offset="50%" style="stop-color:#0099ff" />
      <stop offset="100%" style="stop-color:#7c4dff" />
    </linearGradient>
  </defs>
  
  <!-- Background for app icon -->
  <rect x="0" y="0" width="64" height="64" rx="12" ry="12" fill="#0d0d12"/>
  
  <g filter="url(#glow)">
    <!-- Frame -->
    <rect x="8" y="8" width="48" height="48" rx="7" ry="7" 
          fill="none" stroke="url(#iconGradient)" stroke-width="2.5" 
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lens -->
    <rect x="16" y="16" width="32" height="32" rx="5" ry="5" 
          fill="rgba(0,212,170,0.1)" stroke="rgba(0,212,170,0.5)" stroke-width="1.5"/>
    <!-- Center -->
    <circle cx="32" cy="32" r="4" fill="url(#iconGradient)"/>
    <!-- Corner nodes -->
    <g stroke="url(#iconGradient)" stroke-width="1.5" stroke-linecap="round">
      <line x1="8" y1="14" x2="8" y2="20" />
      <line x1="8" y1="14" x2="14" y2="14" />
      <line x1="46" y1="14" x2="52" y2="14" />
      <line x1="52" y1="14" x2="52" y2="20" />
      <line x1="8" y1="34" x2="8" y2="40" />
      <line x1="8" y1="40" x2="14" y2="40" />
      <line x1="46" y1="40" x2="52" y2="40" />
      <line x1="52" y1="34" x2="52" y2="40" />
    </g>
  </g>
</svg>