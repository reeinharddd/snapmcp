<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" width="256" height="64">
  <defs>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c4dff;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lensGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="30%" style="stop-color:#00d4aa;stop-opacity:0.3" />
      <stop offset="70%" style="stop-color:#0099ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo mark (left) -->
  <g transform="translate(8, 8)" filter="url(#glow)">
    <rect x="0" y="0" width="48" height="48" rx="7" ry="7" 
          fill="none" stroke="url(#frameGradient)" stroke-width="2.5" 
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="8" y="8" width="32" height="32" rx="5" ry="5" 
          fill="url(#lensGradient)" stroke="rgba(0,212,170,0.4)" stroke-width="1"/>
    <circle cx="24" cy="24" r="5" fill="url(#frameGradient)" opacity="0.9"/>
    <g stroke="url(#frameGradient)" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="12" x2="0" y2="18" />
      <line x1="0" y1="12" x2="6" y2="12" />
      <line x1="42" y1="12" x2="48" y2="12" />
      <line x1="48" y1="12" x2="48" y2="18" />
      <line x1="0" y1="30" x2="0" y2="36" />
      <line x1="0" y1="36" x2="6" y2="36" />
      <line x1="42" y1="36" x2="48" y2="36" />
      <line x1="48" y1="30" x2="48" y2="36" />
    </g>
    <g stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-linecap="round">
      <line x1="24" y1="14" x2="24" y2="18" />
      <line x1="24" y1="30" x2="24" y2="34" />
      <line x1="14" y1="24" x2="18" y2="24" />
      <line x1="30" y1="24" x2="34" y2="24" />
    </g>
  </g>
  
  <!-- Wordmark (right) -->
  <text x="72" y="40" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" 
        font-size="28" font-weight="600" fill="#e8e8f0" letter-spacing="-0.5px">
    <tspan fill="url(#frameGradient)">snap</tspan>mcp
  </text>
</svg>