<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradient for the frame -->
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c4dff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the lens/capture -->
    <radialGradient id="lensGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="30%" style="stop-color:#00d4aa;stop-opacity:0.3" />
      <stop offset="70%" style="stop-color:#0099ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0" />
    </radialGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- Background circle (subtle) -->
  <circle cx="64" cy="64" r="60" fill="#0d0d12" stroke="url(#frameGradient)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Main frame - the "capture" metaphor -->
  <g filter="url(#glow)">
    <!-- Outer frame -->
    <rect x="24" y="24" width="80" height="80" rx="12" ry="12" 
          fill="none" stroke="url(#frameGradient)" stroke-width="3" 
          stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner frame (lens) -->
    <rect x="36" y="36" width="56" height="56" rx="8" ry="8" 
          fill="url(#lensGradient)" stroke="rgba(0,212,170,0.4)" stroke-width="1.5"/>
    
    <!-- Center capture point -->
    <circle cx="64" cy="64" r="8" fill="url(#frameGradient)" opacity="0.9"/>
    
    <!-- Corner accents - "MCP" connection nodes -->
    <g stroke="url(#frameGradient)" stroke-width="2.5" stroke-linecap="round">
      <!-- Top-left -->
      <line x1="24" y1="34" x2="24" y2="44" />
      <line x1="24" y1="34" x2="34" y2="34" />
      <!-- Top-right -->
      <line x1="94" y1="34" x2="104" y2="34" />
      <line x1="104" y1="34" x2="104" y2="44" />
      <!-- Bottom-left -->
      <line x1="24" y1="84" x2="24" y2="94" />
      <line x1="24" y1="94" x2="34" y2="94" />
      <!-- Bottom-right -->
      <line x1="94" y1="94" x2="104" y2="94" />
      <line x1="104" y1="84" x2="104" y2="94" />
    </g>
    
    <!-- Center crosshair - precision/capture -->
    <g stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round">
      <line x1="64" y1="44" x2="64" y2="50" />
      <line x1="64" y1="78" x2="64" y2="84" />
      <line x1="44" y1="64" x2="50" y2="64" />
      <line x1="78" y1="64" x2="84" y2="64" />
    </g>
  </g>
  
  <!-- Subtle ring animation hint -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#frameGradient)" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3"/>
</svg>